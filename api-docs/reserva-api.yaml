openapi: 3.0.3
info:
  title: "API de Reservas - Management-Sport"
  description: "Documentación de los endpoints para la gestión de Reservas, Pagos y Reprogramaciones."
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ReservaId:
      name: id
      in: path
      required: true
      description: "ID de la reserva a operar."
      schema:
        type: integer
  schemas:
    EstadoReserva:
      type: string
      enum: [PENDIENTE, PAGADA, COMPLETADO, CANCELADO, REEMBOLSADO]
    MetodoPago:
      type: string
      enum: [EFECTIVO, TRANSFERENCIA, TARJETA, YAPE, PLIN]
    TipoTransaccion:
      type: string
      enum: [INGRESO, SALIDA]

    KpiResponse:
      type: object
      properties:
        total:
          type: number
          example: 25

    ReservaResponse:
      type: object
      properties:
        id: { type: integer, example: 1 }
        canchaId: { type: integer, example: 1 }
        nombreCancha: { type: string, example: "Cancha A" }
        clienteId: { type: integer, example: 1 }
        nombreCliente: { type: string, example: "Juan Pérez" }
        usuarioId: { type: integer, example: 1 }
        nombreUsuario: { type: string, example: "admin" }
        eventoId: { type: integer, nullable: true, example: null }
        tipoReserva: { type: string, enum: [REGULAR, EVENTO] }
        fecha: { type: string, format: date }
        horaInicio: { type: string, format: time, example: "19:00:00" }
        horaFin: { type: string, format: time, example: "20:00:00" }
        montoTotal: { type: number, format: double, example: 80.00 }
        montoPagado: { type: number, format: double, example: 80.00 }
        saldoPendiente: { type: number, format: double, example: 0.00 }
        estadoReserva: { $ref: '#/components/schemas/EstadoReserva' }

    CreateReservaRequest:
      type: object
      required: [canchaId, clienteId, fecha, horaInicio, horaFin]
      properties:
        canchaId: { type: integer }
        clienteId: { type: integer }
        fecha: { type: string, format: date }
        horaInicio: { type: string, format: time }
        horaFin: { type: string, format: time }

    UpdateReservaRequest:
      type: object
      properties:
        clienteId: { type: integer }

    AddPagoToReservaRequest:
      type: object
      required: [monto, metodoPago]
      properties:
        monto: { type: number, format: double, minimum: 0.01 }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }

    CancelReservaRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, maxLength: 250 }

    ReprogramarReservaRequest:
      type: object
      required: [nuevaFecha, nuevaHoraInicio, nuevaHoraFin]
      properties:
        nuevaFecha: { type: string, format: date }
        nuevaHoraInicio: { type: string, format: time }
        nuevaHoraFin: { type: string, format: time }

    CreateReembolsoRequest:
      type: object
      required: [monto, metodoPago]
      properties:
        monto:
          type: number
          format: double
          description: "El monto exacto del crédito a reembolsar."
          example: 20.00
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        nota:
          type: string
          nullable: true
          description: "Nota opcional sobre el motivo del reembolso manual."
          example: "Reembolso por cambio a horario más económico."

    PagoResponse:
      type: object
      properties:
        id: { type: integer }
        reservaId: { type: integer }
        eventoId: { type: integer, nullable: true }
        fecha: { type: string, format: date }
        monto: { type: number, format: double }
        metodoPago: { $ref: '#/components/schemas/MetodoPago' }
        estado: { type: string, enum: [COMPLETADO, ANULADO] }
        tipoTransaccion: { $ref: '#/components/schemas/TipoTransaccion' }
        referencia: { type: string, nullable: true }
        nota: { type: string, nullable: true }

paths:
  /reservas:
    get:
      tags:
        - Reservas
      summary: "Listar y filtrar reservas"
      description: "Obtiene una lista paginada de reservas. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      parameters:
        - { name: fechaDesde, in: query, schema: { type: string, format: date } }
        - { name: fechaHasta, in: query, schema: { type: string, format: date } }
        - { name: canchaId, in: query, schema: { type: integer } }
        - { name: clienteId, in: query, schema: { type: integer } }
        - { name: sucursalId, in: query, schema: { type: integer } }
        - { name: estadoReserva, in: query, schema: { $ref: '#/components/schemas/EstadoReserva' } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        '200':
          description: "Lista de reservas obtenida con éxito."
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservaResponse'
        '403':
          description: "Acceso denegado."
    post:
      tags:
        - Reservas
      summary: "Crear una nueva reserva"
      description: "Crea una nueva reserva regular. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservaRequest'
      responses:
        '201':
          description: "Reserva creada con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: "Datos inválidos o conflicto de horario."
        '403':
          description: "Acceso denegado."

  /reservas/stats/completadas-hoy:
    get:
      tags:
        - Reservas - Estadísticas
      summary: "Obtener total de reservas completadas hoy"
      description: "Devuelve el número total de reservas completadas hoy. Accesible para roles: `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      parameters:
        - name: sucursalId
          in: query
          description: "ID de la sucursal para filtrar. Si se omite, se calcula el total."
          schema:
            type: integer
      responses:
        '200':
          description: "Total de reservas completadas hoy."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '403':
          description: "Acceso denegado."

  /reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    get:
      tags:
        - Reservas
      summary: "Obtener una reserva por su ID"
      description: "Recupera los detalles de una reserva. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Detalles de la reserva."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '403':
          description: "Acceso denegado."
        '404':
          description: "Reserva no encontrada."
    put:
      tags:
        - Reservas
      summary: "Actualizar datos de una reserva"
      description: "Permite actualizar campos como el cliente asociado. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservaRequest'
      responses:
        '200':
          description: "Reserva actualizada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '403':
          description: "Acceso denegado."
        '404':
          description: "Reserva no encontrada."
    delete:
      tags:
        - Reservas
      summary: "Eliminar una reserva"
      description: "Elimina una reserva solo si no tiene pagos. Accesible para roles: `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      responses:
        '204':
          description: "Reserva eliminada."
        '400':
          description: "La reserva tiene pagos y no puede ser eliminada."
        '403':
          description: "Acceso denegado."
        '404':
          description: "Reserva no encontrada."

  /reservas/{id}/pagos:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    get:
      tags:
        - Pagos
      summary: "Obtener historial de pagos de una reserva"
      description: "Recupera todos los pagos de una reserva. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Lista de pagos de la reserva."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PagoResponse'
        '403':
          description: "Acceso denegado."
    post:
      tags:
        - Pagos
      summary: "Añadir un pago a una reserva"
      description: "Registra un pago para una reserva. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPagoToReservaRequest'
      responses:
        '200':
          description: "Pago registrado y reserva actualizada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: "El monto excede el saldo o la reserva está cancelada."
        '403':
          description: "Acceso denegado."

  /reservas/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    patch:
      tags:
        - Reservas
      summary: "Cancelar una reserva"
      description: "Cancela una reserva. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservaRequest'
      responses:
        '200':
          description: "Reserva cancelada/reembolsada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: "La reserva ya está en un estado final."
        '403':
          description: "Acceso denegado."

  /reservas/{id}/reprogramar:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags:
        - Reservas
      summary: "Reprogramar una reserva"
      description: "Crea una nueva reserva con el nuevo horario. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprogramarReservaRequest'
      responses:
        '200':
          description: "Reserva reprogramada con éxito."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: "El nuevo horario no está disponible."
        '403':
          description: "Acceso denegado."

  /reservas/{id}/reembolsos:
    post:
      tags:
        - Pagos
      summary: "Registrar un reembolso manual"
      description: "Registra una transacción de SALIDA para una reserva con crédito a favor. Accesible para roles: `RECEPTIONIST`, `ADMIN`, `SUPERADMIN`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReembolsoRequest'
      responses:
        '200':
          description: "Reembolso registrado y saldos actualizados."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: "La reserva no tiene un crédito a favor."
        '403':
          description: "Acceso denegado."
        '404':
          description: "Reserva no encontrada."
